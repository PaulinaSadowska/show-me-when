name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Build static board
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          test -n "$API_BASE"
          export BUILD_SHA="$(git log -1 --format=%H -- app)"
          mkdir dist
          cp -R app/. dist/
          if [ -d recordings ]; then cp -R recordings dist/recordings; fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          dist = Path('dist')
          api = os.environ['API_BASE'].rstrip('/')
          (dist / 'config.js').write_text('export const API = ' + json.dumps(api) + ';\n')
          page = dist / 'index.html'
          html = page.read_text().replace('content="pending"', 'content="' + os.environ['BUILD_SHA'] + '"')
          html = html.replace('>pending</span>', '>' + os.environ['BUILD_SHA'] + '</span>')
          page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
